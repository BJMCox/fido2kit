[package]
name = "fido2kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "FIDO2 security-key code and the vault slot store shared by fido2kpxc, fido2lock, and fido2tomb"
publish = false

[features]
default = ["vault"]
vault = [
    "dep:base64",
    "dep:chacha20poly1305",
    "dep:hkdf",
    "dep:hmac",
    "dep:serde",
    "dep:sha2",
    "dep:tempfile",
    "dep:toml",
    "dep:vsss-rs",
    "getrandom/sys_rng",
]

[dependencies]
anyhow = "1"
base64 = { version = "0.23", optional = true }
chacha20poly1305 = { version = "0.11", features = ["zeroize"], optional = true }
ctap-hid-fido2 = "3.6"
getrandom = "0.4"
hkdf = { version = "0.13", optional = true }
hmac = { version = "0.13", features = ["zeroize"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
sha2 = { version = "0.11", features = ["zeroize"], optional = true }
tempfile = { version = "3", optional = true }
toml = { version = "1", optional = true }
unicode-normalization = "0.1"
vsss-rs = { version = "6", default-features = false, features = ["alloc", "zeroize"], optional = true }
zeroize = "1"
