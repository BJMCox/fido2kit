# Shared by the codeql workflow and local CodeQL runs, so both report the same findings.
# The query suite (security-extended) is named in the workflow, because the local CLI cannot
# resolve the config's shorthand for it.
name: fido2kit
# Tests live in tests.rs files and use fixed salts and sample passwords on purpose, and the vault
# fixture holds test ciphertexts. CodeQL's Rust analysis does not recognize #[cfg(test)], so it
# would report them as secrets.
paths-ignore:
  - "**/src/**/tests.rs"
  - "**/src/**/fixtures/**"
  - target
